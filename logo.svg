<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2D44"/><stop offset="1" stop-color="#070D12"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#1D5FE0" stop-opacity=".45"/><stop offset="1" stop-color="#1D5FE0" stop-opacity="0"/></radialGradient>
    <linearGradient id="pulse" x1="0" x2="1"><stop offset="0" stop-color="#5C9DFF"/><stop offset="1" stop-color="#9CC2FF"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- dial -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#2B3A46" stroke-width="14"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#5C9DFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="790 1056" transform="rotate(-90 256 256)"/>
  <g stroke="#A7B6C3" stroke-linecap="round">
    <g stroke-width="10"><line x1="256" y1="110" x2="256" y2="134"/><line x1="402" y1="256" x2="378" y2="256"/><line x1="256" y1="402" x2="256" y2="378"/><line x1="110" y1="256" x2="134" y2="256"/></g>
    <g stroke-width="6" opacity=".7">
      <line x1="329" y1="129.6" x2="323" y2="140"/><line x1="382.4" y1="183" x2="372" y2="189"/>
      <line x1="382.4" y1="329" x2="372" y2="323"/><line x1="329" y1="382.4" x2="323" y2="372"/>
      <line x1="183" y1="382.4" x2="189" y2="372"/><line x1="129.6" y1="329" x2="140" y2="323"/>
      <line x1="129.6" y1="183" x2="140" y2="189"/><line x1="183" y1="129.6" x2="189" y2="140"/>
    </g>
  </g>
  <!-- rhythm pulse -->
  <path d="M60 268 H176 L200 222 L232 320 L268 168 L298 300 L318 254 L336 268 H452" fill="none" stroke="#1D5FE0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity=".8"/>
  <path d="M60 268 H176 L200 222 L232 320 L268 168 L298 300 L318 254 L336 268 H452" fill="none" stroke="url(#pulse)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- check badge at 12 o'clock end of arc -->
  <circle cx="375" cy="137" r="46" fill="#3B7452" stroke="#0B131A" stroke-width="10"/>
  <path d="M354 138 L369 153 L397 123" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
